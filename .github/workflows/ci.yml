name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deal_coordinator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deal_coordinator_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      # pnpm version from root package.json "packageManager"
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @deal-coordinator/db generate

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      # Applies migrations to the real Render staging DB before the job reports success.
      # Pair with render.yaml autoDeployTrigger: checksPass so new containers roll out only after CI (incl. migrate) passes.
      # Add repo secret STAGING_DATABASE_URL (Postgres external URL from Render; same DB the API uses).
      - name: Prisma migrate deploy (staging, main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Skipping migrate — set repository secret STAGING_DATABASE_URL to auto-apply migrations on each main push."
            exit 0
          fi
          pnpm --filter @deal-coordinator/db migrate:deploy

      - name: Build
        run: pnpm build
